
                <!DOCTYPE html>
                <html>
                <head>
                    <meta charset="UTF-8">
                    <title>Ragıp Evren Aydoğan - Yazar Karnesi</title>
                    <script src="https://cdn.plot.ly/plotly-latest.min.js"></script>
                    <script src="https://cdn.tailwindcss.com"></script>
                    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
                    <style>body { font-family: 'Inter', sans-serif; }</style>
                </head>
                <body class="bg-gray-50 text-slate-800">
                    <div class="max-w-7xl mx-auto px-4 py-8">
                        <a href="yazarlar_karsilastirma.html" class="text-blue-600 hover:underline mb-4 inline-block">&larr; Tüm Yazarlar</a>
                        
            <!-- TEPAV AUTHOR SCORECARD MODULE -->
            <div class="bg-gray-50 rounded-2xl p-6 mb-12 border border-gray-200" id="author-scorecard-root">
                <div class="flex flex-col md:flex-row justify-between items-center mb-8">
                    <div class="flex items-center space-x-6 mb-4 md:mb-0">
                        <div class="w-24 h-24 bg-blue-100 rounded-full flex items-center justify-center text-3xl font-bold text-blue-600 border-4 border-white shadow-sm">
                            RE
                        </div>
                        <div>
                            <h2 class="text-3xl font-extrabold text-slate-900 tracking-tight">Yazar Performans Karnesi</h2>
                            <p class="text-gray-500 font-medium">12 Aylık Gelişim & Etki Analizi</p>
                        </div>
                    </div>
                     <!-- Month Selector -->
                    <div class="bg-white p-2 rounded-lg shadow-sm border border-gray-200">
                        <label for="monthSelect" class="block text-xs font-bold text-gray-400 uppercase tracking-wider mb-1 px-1">Dönem Seçiniz</label>
                        <select id="monthSelect" onchange="updateDashboard(this.value)" class="block w-48 pl-3 pr-10 py-2 text-sm border-gray-300 focus:outline-none focus:ring-2 focus:ring-blue-500 rounded-md bg-gray-50 font-semibold text-gray-700">
                            <!-- Options populated by JS -->
                        </select>
                    </div>
                </div>
                
                 <!-- KPI Grid -->
                <div class="grid grid-cols-2 lg:grid-cols-5 gap-4 mb-8">
                    <div class="bg-white p-5 rounded-xl border border-gray-100 shadow-sm hover:shadow-md transition-shadow">
                        <div class="text-xs font-bold text-gray-400 uppercase tracking-wider">Toplam Etki</div>
                        <div class="text-2xl font-black text-blue-600 mt-1" id="val_impact">0</div>
                    </div>
                    <div class="bg-white p-5 rounded-xl border border-gray-100 shadow-sm hover:shadow-md transition-shadow">
                        <div class="text-xs font-bold text-gray-400 uppercase tracking-wider">Momentum Skoru</div>
                        <div class="text-2xl font-black text-purple-600 mt-1" id="val_momentum">0</div>
                        <div class="text-[10px] text-purple-400 font-medium mt-1">CANLILIK ENDEKSİ</div>
                    </div>
                    <div class="bg-white p-5 rounded-xl border border-gray-100 shadow-sm hover:shadow-md transition-shadow">
                        <div class="text-xs font-bold text-gray-400 uppercase tracking-wider">Profil Çekimi</div>
                        <div class="text-2xl font-black text-pink-600 mt-1" id="val_magnetism">0</div>
                        <div class="text-[10px] text-pink-400 font-medium mt-1">BİYOGRAFİ TRAFİĞİ</div>
                    </div>
                    <div class="bg-white p-5 rounded-xl border border-gray-100 shadow-sm hover:shadow-md transition-shadow">
                        <div class="text-xs font-bold text-gray-400 uppercase tracking-wider">Verimlilik</div>
                        <div class="text-2xl font-black text-green-600 mt-1" id="val_efficiency">0.0</div>
                        <div class="text-[10px] text-gray-400 mt-1">GÖRÜNTÜLEME / YAZI</div>
                    </div>
                    <div class="bg-white p-5 rounded-xl border border-gray-100 shadow-sm hover:shadow-md transition-shadow">
                        <div class="text-xs font-bold text-gray-400 uppercase tracking-wider">Üretkenlik</div>
                        <div class="text-2xl font-black text-orange-600 mt-1" id="val_productivity">0</div>
                        <div class="text-[10px] text-gray-400 mt-1">TOPLAM YAZI (YILLIK)</div>
                    </div>
                </div>
                
                <!-- Charts -->
                <div class="grid grid-cols-1 lg:grid-cols-12 gap-6">
                    <!-- Radar -->
                    <div class="lg:col-span-5 bg-white p-4 rounded-2xl border border-gray-100 shadow-sm">
                        <h3 class="text-sm font-bold text-gray-500 uppercase tracking-wide mb-4 text-center">Performans Dağılımı</h3>
                        <div id="radarChart" class="w-full h-64"></div>
                    </div>
                    <!-- Momentum Trend -->
                    <div class="lg:col-span-7 bg-white p-4 rounded-2xl border border-gray-100 shadow-sm">
                        <h3 class="text-sm font-bold text-gray-500 uppercase tracking-wide mb-4 text-center">Momentum Trendi (Son 1 Yıl)</h3>
                        <div id="momentumChart" class="w-full h-64"></div>
                    </div>
                </div>
            </div>
            
            <script>
                // Embedded Data
                var historyData = {"2025-02": {"productivity": 0, "total_impact": 0, "efficiency": 0.0, "momentum": 0, "consistency": 0.0, "profile_magnetism": 0}, "2025-03": {"productivity": 0, "total_impact": 0, "efficiency": 0.0, "momentum": 0, "consistency": 0.0, "profile_magnetism": 0}, "2025-04": {"productivity": 0, "total_impact": 0, "efficiency": 0.0, "momentum": 0, "consistency": 0.0, "profile_magnetism": 0}, "2025-05": {"productivity": 0, "total_impact": 0, "efficiency": 0.0, "momentum": 0, "consistency": 0.0, "profile_magnetism": 0}, "2025-06": {"productivity": 0, "total_impact": 0, "efficiency": 0.0, "momentum": 0, "consistency": 0.0, "profile_magnetism": 0}, "2025-07": {"productivity": 0, "total_impact": 0, "efficiency": 0.0, "momentum": 0, "consistency": 0.0, "profile_magnetism": 0}, "2025-08": {"productivity": 0, "total_impact": 0, "efficiency": 0.0, "momentum": 0, "consistency": 0.0, "profile_magnetism": 0}, "2025-09": {"productivity": 0, "total_impact": 0, "efficiency": 0.0, "momentum": 0, "consistency": 0.0, "profile_magnetism": 0}, "2025-10": {"productivity": 0, "total_impact": 0, "efficiency": 0.0, "momentum": 0, "consistency": 0.0, "profile_magnetism": 0}, "2025-11": {"productivity": 0, "total_impact": 0, "efficiency": 0.0, "momentum": 0, "consistency": 0.0, "profile_magnetism": 0}, "2025-12": {"productivity": 0, "total_impact": 0, "efficiency": 0.0, "momentum": 0, "consistency": 0.0, "profile_magnetism": 0}, "2026-01": {"productivity": 0, "total_impact": 0, "efficiency": 0.0, "momentum": 0, "consistency": 0.0, "profile_magnetism": 0}};
                var normData = {"2025-02": {"productivity": 0.0, "total_impact": 0.0, "efficiency": 0.0, "momentum": 0.0, "consistency": 0.0, "profile_magnetism": 0.0}, "2025-03": {"productivity": 0.0, "total_impact": 0.0, "efficiency": 0.0, "momentum": 0.0, "consistency": 0.0, "profile_magnetism": 0.0}, "2025-04": {"productivity": 0.0, "total_impact": 0.0, "efficiency": 0.0, "momentum": 0.0, "consistency": 0.0, "profile_magnetism": 0.0}, "2025-05": {"productivity": 0.0, "total_impact": 0.0, "efficiency": 0.0, "momentum": 0.0, "consistency": 0.0, "profile_magnetism": 0.0}, "2025-06": {"productivity": 0.0, "total_impact": 0.0, "efficiency": 0.0, "momentum": 0.0, "consistency": 0.0, "profile_magnetism": 0.0}, "2025-07": {"productivity": 0.0, "total_impact": 0.0, "efficiency": 0.0, "momentum": 0.0, "consistency": 0.0, "profile_magnetism": 0.0}, "2025-08": {"productivity": 0.0, "total_impact": 0.0, "efficiency": 0.0, "momentum": 0.0, "consistency": 0.0, "profile_magnetism": 0.0}, "2025-09": {"productivity": 0.0, "total_impact": 0.0, "efficiency": 0.0, "momentum": 0.0, "consistency": 0.0, "profile_magnetism": 0.0}, "2025-10": {"productivity": 0.0, "total_impact": 0.0, "efficiency": 0.0, "momentum": 0.0, "consistency": 0.0, "profile_magnetism": 0.0}, "2025-11": {"productivity": 0.0, "total_impact": 0.0, "efficiency": 0.0, "momentum": 0.0, "consistency": 0.0, "profile_magnetism": 0.0}, "2025-12": {"productivity": 0.0, "total_impact": 0.0, "efficiency": 0.0, "momentum": 0.0, "consistency": 0.0, "profile_magnetism": 0.0}, "2026-01": {"productivity": 0.0, "total_impact": 0.0, "efficiency": 0.0, "momentum": 0.0, "consistency": 0.0, "profile_magnetism": 0.0}};
                
                // --- Logic ---
                // Populate Dropdown
                var monthSelect = document.getElementById('monthSelect');
                var months = Object.keys(historyData).sort();
                var latestMonth = months[months.length - 1];
                
                months.reverse().forEach(function(m) {
                    var option = document.createElement("option");
                    option.value = m;
                    option.text = m;
                    if(m === latestMonth) option.selected = true;
                    monthSelect.appendChild(option);
                });
                
                function updateDashboard(month) {
                    var data = historyData[month];
                    var norm = normData[month];
                    if (!data) return;
                    
                    // Simple animate function could go here
                    document.getElementById('val_impact').innerText = new Intl.NumberFormat('en-US').format(data.total_impact);
                    document.getElementById('val_momentum').innerText = new Intl.NumberFormat('en-US').format(data.momentum);
                    document.getElementById('val_magnetism').innerText = new Intl.NumberFormat('en-US').format(data.profile_magnetism);
                    document.getElementById('val_efficiency').innerText = data.efficiency.toFixed(1);
                    document.getElementById('val_productivity').innerText = data.productivity;
                    
                    // Update Radar
                    // Check if chart exists
                    var chart = document.getElementById('radarChart');
                    if (chart && chart.data) {
                         Plotly.restyle('radarChart', {
                            r: [[norm.total_impact, norm.momentum, norm.profile_magnetism, norm.efficiency, norm.productivity, norm.consistency]]
                         });
                    }
                }
                
                // Initialize Charts
                // RADAR
                var initialNorm = normData[latestMonth] || {};
                var radarData = [{
                    type: 'scatterpolar',
                    r: [
                        initialNorm.total_impact || 0, 
                        initialNorm.momentum || 0, 
                        initialNorm.profile_magnetism || 0,
                        initialNorm.efficiency || 0,
                        initialNorm.productivity || 0,
                        initialNorm.consistency || 0
                    ],
                    theta: ['Etki', 'Momentum', 'Profil', 'Verimlilik', 'Üretkenlik', 'İstikrar'],
                    fill: 'toself',
                    line: {color: '#2563eb'},
                    hovertemplate: 'Skor: %{r:.1f}<extra></extra>'
                }];
                
                var radarLayout = {
                    polar: {
                        radialaxis: { visible: true, range: [0, 100], showticklabels: false }
                    },
                    margin: { t: 20, b: 20, l: 30, r: 30 },
                    height: 250,
                    showlegend: false
                };
                Plotly.newPlot('radarChart', radarData, radarLayout, {displayModeBar: false});
                
                // MOMENTUM LINE
                // We need the momentum history for the selected month? No, usually trend is static history or updates?
                // The user wants "Momentum Score Line Grafiği".
                // Let's show the full history curve we calculated in 'mom_dates'/values earlier?
                // But row data structure is different now. We can extract momentum from historyData keys.
                
                var momDates = Object.keys(historyData).sort();
                var momValues = momDates.map(m => historyData[m].momentum);
                
                var momTrace = {
                    x: momDates,
                    y: momValues,
                    type: 'scatter',
                    mode: 'lines+markers',
                    line: {color: '#9333ea', shape: 'spline', width: 3},
                    marker: {size: 6, color: '#FFFFFF', line: {color: '#9333ea', width: 2}}
                };
                
                var momLayout = {
                    margin: { t: 10, b: 30, l: 40, r: 10 },
                    height: 250,
                    xaxis: { showgrid: false, tickformat: '%Y-%m', nticks: 5 },
                    yaxis: { showgrid: true, gridcolor: '#f3f4f6' },
                    showlegend: false
                };
                Plotly.newPlot('momentumChart', [momTrace], momLayout, {displayModeBar: false});
                
            </script>
            <!-- END SCORECARD MODULE -->
            
                    </div>
                </body>
                </html>
